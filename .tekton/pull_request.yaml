apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: sv-direct-existing-ns-pr-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  pipelineRef:
    name: pac-ref-type-pipeline
  params:
    - name: trigger-type
      value: "github-pr-direct-existing-ns-pipeline"
    - name: message
      value: "GitHub App PR triggered direct namespace pipelineRef run"
    - name: source-repo
      value: "{{ repo_url }}"
    - name: source-branch
      value: "{{ source_branch }}"
    - name: target-branch
      value: "{{ target_branch }}"
    - name: revision
      value: "{{ revision }}"
    - name: pr-number
      value: "{{ pull_request_number }}"
  taskRunTemplate:
    serviceAccountName: default
    podTemplate:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
