apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: sv-repo-defined-main-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/pipeline: ".tekton/pipeline.yaml"
spec:
  pipelineRef:
    name: sv-repo-defined-pipeline
  params:
    - name: trigger-type
      value: "github-push-repo-defined-pipeline"
    - name: message
      value: "GitHub App push triggered repo-defined pipelineRef run"
    - name: source-repo
      value: "{{ repo_url }}"
    - name: source-branch
      value: "{{ source_branch }}"
    - name: target-branch
      value: "{{ target_branch }}"
    - name: revision
      value: "{{ revision }}"
    - name: pr-number
      value: ""
  taskRunTemplate:
    serviceAccountName: default
    podTemplate:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
